name: Native self-hosting

on:
  workflow_dispatch:
    inputs:
      dart_sdk:
        description: Dart SDK version for this validation batch
        required: false
        default: stable
        type: string
      architecture:
        description: Linux architecture or Intel macOS to validate
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64
          - both
          - macos-x64
      package_release:
        description: Package and verify the native release archive
        required: false
        default: false
        type: boolean
      cross_ref:
        description: Commit or branch containing matching native target seeds
        required: false
        type: string

jobs:
  linux:
    if: inputs.architecture != 'macos-x64'
    name: linux-${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: >-
          ${{ fromJSON(inputs.architecture == 'arm64' && '["arm64"]' ||
                      inputs.architecture == 'x64' && '["x64"]' ||
                      '["arm64","x64"]') }}
    env:
      DARTC_CROSS_SEED: ${{ matrix.architecture == 'arm64' && 'dartc-linux' || 'dartc-linux-x64' }}
      DARTC_MACOS_OUTPUT: ${{ matrix.architecture == 'arm64' && 'dartc-cross-macos' || 'dartc-cross-macos-x64' }}
    steps:
      - uses: actions/checkout@v7
      - name: Keep test failures in the runner temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '${{ inputs.dart_sdk }}'
          architecture: ${{ matrix.architecture }}
      - uses: actions/checkout@v7
        if: inputs.cross_ref != ''
        with:
          ref: ${{ inputs.cross_ref }}
          path: .cross
      - name: Bootstrap from the supplied native seed
        if: inputs.cross_ref != ''
        run: dart tool/bootstrap.dart --seed ".cross/$DARTC_CROSS_SEED"
      - name: Cold bootstrap without an existing seed
        if: inputs.cross_ref == ''
        run: dart tool/bootstrap.dart
      - run: dart test/bootstrap_test.dart --compiler build/dartc-stage2
      - run: dart test/library_test.dart build/dartc-stage2
      - run: dart test/differential_test.dart --compiler build/dartc-stage2
      - run: dart test/measure_test.dart --compiler build/dartc-stage2 --std lib/src/runtime.dart
      - run: dart test/ssa_test.dart --compiler build/dartc-stage2 --std lib/src/runtime.dart
      - run: dart test/program_benchmark_test.dart --compiler build/dartc-stage2
      - run: dart tool/fuzz.dart --compiler build/dartc-stage2 --count 12
      - name: Verify native archive dependencies
        if: inputs.package_release
        run: dart test/package_release_test.dart --compiler build/dartc-stage2
      - name: Package and test the native release
        if: inputs.package_release && matrix.architecture == 'arm64'
        run: dart tool/package_release.dart --compiler build/dartc-stage2
      - uses: actions/upload-artifact@v7
        if: inputs.package_release && matrix.architecture == 'arm64'
        with:
          name: dartc-linux-arm64-release
          path: build/release/*
          if-no-files-found: error
          retention-days: 7
      - name: Rebuild the generated entry with the Mac-built compiler
        if: inputs.cross_ref != ''
        env:
          PATH: /usr/bin:/bin
        run: |
          ".cross/$DARTC_CROSS_SEED" "$PWD/build/compiler.dart" --std "$PWD/lib/src/runtime.dart" -o "$PWD/build/cross-stage1"
          cmp build/cross-stage1 build/dartc-stage2
      - name: Cross-compile back to macOS
        env:
          PATH: /usr/bin:/bin
        run: build/dartc-stage2 "$PWD/build/compiler.dart" --std "$PWD/lib/src/runtime.dart" --target macos-arm64 -o "$PWD/build/$DARTC_MACOS_OUTPUT"
      - name: Package and test the native release
        if: inputs.package_release && matrix.architecture == 'x64'
        run: dart tool/package_release.dart --compiler build/dartc-stage2
      - uses: actions/upload-artifact@v7
        if: inputs.package_release && matrix.architecture == 'x64'
        with:
          name: dartc-linux-x64-release
          path: build/release/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DARTC_MACOS_OUTPUT }}
          path: build/${{ env.DARTC_MACOS_OUTPUT }}
          retention-days: 1
      - name: Archive failed validation evidence
        if: failure()
        run: |
          shopt -s nullglob
          paths=()
          for path in build "$RUNNER_TEMP"/dartc-*; do
            if test -e "$path"; then paths+=("$path"); fi
          done
          if ((${#paths[@]})); then
            tar -czf "$RUNNER_TEMP/native-evidence.tar.gz" "${paths[@]}"
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: dartc-linux-${{ matrix.architecture }}-failure
          path: ${{ runner.temp }}/native-evidence.tar.gz
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7

  macos-x64:
    if: inputs.architecture == 'macos-x64'
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Keep test failures in the runner temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '${{ inputs.dart_sdk }}'
          architecture: x64
      - name: Verify the Intel host
        run: test "$(uname -m)" = x86_64
      - uses: actions/checkout@v7
        if: inputs.cross_ref != ''
        with:
          ref: ${{ inputs.cross_ref }}
          path: .cross
      - name: Bootstrap from the supplied Intel seed
        if: inputs.cross_ref != ''
        run: |
          shasum -a 256 .cross/dartc-macos-x64
          dart tool/bootstrap.dart --seed .cross/dartc-macos-x64
      - name: Cold bootstrap without an existing seed
        if: inputs.cross_ref == ''
        run: dart tool/bootstrap.dart
      - run: dart test/bootstrap_test.dart --compiler build/dartc-stage2
      - run: dart test/library_test.dart build/dartc-stage2
      - run: dart test/differential_test.dart --compiler build/dartc-stage2
      - run: dart test/ssa_test.dart --compiler build/dartc-stage2 --std lib/src/runtime.dart
      - run: dart test/measure_test.dart --compiler build/dartc-stage2 --std lib/src/runtime.dart
      - run: dart test/program_benchmark_test.dart --compiler build/dartc-stage2
      - run: dart tool/fuzz.dart --compiler build/dartc-stage2 --count 12
      - name: Cross-compile the compiler for Apple Silicon and Linux
        env:
          PATH: /usr/bin:/bin
        run: |
          build/dartc-stage2 build/compiler.dart --std lib/src/runtime.dart --target macos-arm64 -o build/dartc-cross-macos-arm64
          build/dartc-stage2 build/compiler.dart --std lib/src/runtime.dart --target linux-x64 -o build/dartc-cross-linux-x64
          build/dartc-stage2 build/compiler.dart --std lib/src/runtime.dart --target linux-arm64 -o build/dartc-cross-linux-arm64
          build/dartc-stage2 test/fixtures/values.dart --std lib/src/runtime.dart --target macos-arm64 -o build/values-cross-macos-arm64
          build/dartc-stage2 test/fixtures/values.dart --std lib/src/runtime.dart --target macos-x64 -o build/values-macos-x64
      - name: Package and test the native release
        if: inputs.package_release
        run: |
          dart test/package_release_test.dart --compiler build/dartc-stage2
          dart tool/package_release.dart --compiler build/dartc-stage2
      - name: Archive validation evidence
        if: always()
        run: |
          shopt -s nullglob
          paths=()
          for path in build "$RUNNER_TEMP"/dartc-*; do
            if test -e "$path"; then paths+=("$path"); fi
          done
          if ((${#paths[@]})); then
            tar -czf "$RUNNER_TEMP/native-evidence.tar.gz" "${paths[@]}"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dartc-macos-x64-validation
          path: ${{ runner.temp }}/native-evidence.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
