name: Native self-hosting

on:
  workflow_dispatch:
    inputs:
      dart_sdk:
        description: Dart SDK version for this validation batch
        required: false
        default: stable
        type: string
      architecture:
        description: Linux architecture to validate
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64
          - both
      package_release:
        description: Package and verify the native Linux release archive
        required: false
        default: false
        type: boolean
      cross_ref:
        description: Commit or branch containing matching Mac-built Linux seeds
        required: false
        type: string

jobs:
  linux-arm64:
    if: inputs.architecture != 'x64'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '${{ inputs.dart_sdk }}'
          architecture: arm64
      - run: dart tool/bootstrap.dart
      - run: dart test/differential_test.dart --compiler build/dartc-stage2
      - run: dart test/measure_test.dart --compiler build/dartc-stage2 --std lib/src/runtime.dart
      - run: dart test/ssa_test.dart --compiler build/dartc-stage2 --std lib/src/runtime.dart
      - run: dart test/program_benchmark_test.dart --compiler build/dartc-stage2
      - run: dart tool/fuzz.dart --compiler build/dartc-stage2 --count 12
      - name: Package and test the native release
        if: inputs.package_release
        run: dart tool/package_release.dart --compiler build/dartc-stage2
      - uses: actions/upload-artifact@v7
        if: inputs.package_release
        with:
          name: dartc-linux-arm64-release
          path: build/release/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/checkout@v7
        if: inputs.cross_ref != ''
        with:
          ref: ${{ inputs.cross_ref }}
          path: .cross
      - name: Run the Mac-built Linux compiler
        if: inputs.cross_ref != ''
        env:
          PATH: /usr/bin:/bin
        run: |
          .cross/dartc-linux "$PWD/bin/dartc.dart" --std "$PWD/lib/src/runtime.dart" -o "$PWD/build/cross-stage1"
          cmp build/cross-stage1 build/dartc-stage2
      - name: Cross-compile back to macOS
        env:
          PATH: /usr/bin:/bin
        run: build/dartc-stage2 "$PWD/bin/dartc.dart" --std "$PWD/lib/src/runtime.dart" --target macos-arm64 -o "$PWD/build/dartc-cross-macos"
      - uses: actions/upload-artifact@v7
        with:
          name: dartc-cross-macos
          path: build/dartc-cross-macos
          retention-days: 1

  linux-x64:
    if: inputs.architecture != 'arm64'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '${{ inputs.dart_sdk }}'
          architecture: x64
      - uses: actions/checkout@v7
        if: inputs.cross_ref != ''
        with:
          ref: ${{ inputs.cross_ref }}
          path: .cross
      - name: Bootstrap from the supplied native seed
        if: inputs.cross_ref != ''
        run: dart tool/bootstrap.dart --seed .cross/dartc-linux-x64
      - name: Cold bootstrap without an existing seed
        if: inputs.cross_ref == ''
        run: dart tool/bootstrap.dart
      - run: dart test/differential_test.dart --compiler build/dartc-stage2
      - run: dart test/measure_test.dart --compiler build/dartc-stage2 --std lib/src/runtime.dart
      - run: dart test/ssa_test.dart --compiler build/dartc-stage2 --std lib/src/runtime.dart
      - run: dart test/program_benchmark_test.dart --compiler build/dartc-stage2
      - run: dart tool/fuzz.dart --compiler build/dartc-stage2 --count 12
      - name: Verify the Mac-built compiler
        if: inputs.cross_ref != ''
        run: cmp .cross/dartc-linux-x64 build/dartc-stage2
      - name: Cross-compile back to macOS
        env:
          PATH: /usr/bin:/bin
        run: build/dartc-stage2 bin/dartc.dart --std lib/src/runtime.dart --target macos-arm64 -o build/dartc-cross-macos-x64
      - name: Package and test the native release
        if: inputs.package_release
        run: dart tool/package_release.dart --compiler build/dartc-stage2
      - uses: actions/upload-artifact@v7
        if: inputs.package_release
        with:
          name: dartc-linux-x64-release
          path: build/release/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: dartc-cross-macos-x64
          path: build/dartc-cross-macos-x64
          retention-days: 1
