include: package:lints/recommended.yaml

analyzer:
  exclude:
    - build/**
    # Programs that are only compiled.
    - tool/bench/**
    - test/programs/**
    # Checked within the libraries they patch, by test/source/sdk_test.dart.
    - sdk/std/**
    - sdk/native/**

linter:
  rules:
    - comment_references
    - unnecessary_primary_constructor_body
    - unnecessary_type_name_in_constructor
    - use_declaring_parameters
    - use_primary_constructors
